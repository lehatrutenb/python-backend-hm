services:
  messanger:
    build:
      dockerfile: Dockerfile_messanger
      context: .
    ports:
      - "8000:8000"
    env_file:
      - .env_compose
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.4
    container_name: postgres_db
    environment:
      POSTGRES_USER: $DB_USER
      POSTGRES_PASSWORD: $DB_PASSWORD
      POSTGRES_DB: $DB_NAME
    ports:
      - "5433:5432"
    volumes:
      - pg_messanger_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
volumes:
  pg_messanger_data: